<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survivor Pass WebApp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Heading or logo can be placed here if needed -->
    <h1 class="title">SURVIVOR PASS</h1>
    <p class="subtitle">Connect your wallet to continue</p>
    <!-- Connect Phantom Wallet Button -->
    <button id="connectBtn" class="button primary">Connect Phantom 
Wallet</button>
    <!-- Buy Survivor Pass Button (opens Crossmint) -->
    <a href="https://www.crossmint.com" target="_blank" id="buyBtn" 
class="button secondary">
      Buy SURVIVOR PASS
    </a>
    <!-- Error message area (hidden by default) -->
    <p id="errorMsg" class="error" style="display: none;"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
